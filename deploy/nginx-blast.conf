# /etc/nginx/sites-available/blast.ayadvisorysolution.com
#
# After placing this file:
#   sudo ln -s /etc/nginx/sites-available/blast.ayadvisorysolution.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blast.ayadvisorysolution.com
#
# certbot will rewrite the listen blocks for HTTPS automatically.

upstream blast_chatmamba_upstream {
    server 127.0.0.1:4011;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name blast.ayadvisorysolution.com;

    # Bigger limit so CSV/Excel imports and image uploads aren't rejected.
    client_max_body_size 25m;

    # Real client IP for express
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Long timeouts so socket.io and slow broadcasts don't get killed.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering off;

    # Static client assets served by the Node app (built into client/dist).
    # Everything is reverse-proxied — no nginx static config needed.
    location / {
        proxy_pass         http://blast_chatmamba_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
